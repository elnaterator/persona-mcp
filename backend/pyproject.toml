[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pktx"
version = "0.1.0"
description = "MCP server for managing personal data — resume, job search, and more"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastmcp>=3.4.7",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-jose[cryptography]>=3.3.0",
    "svix>=1.0.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.1",
    "clerk-backend-api>=1.0.0",
]

[project.scripts]
pktx = "pktx.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1",
    "testcontainers[postgres]>=4.0",
    "pytest-randomly>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pktx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
